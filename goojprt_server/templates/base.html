<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <noscript><meta http-equiv="refresh" content="2"></noscript>
  <title>GoojPrt PT-210 Print Server</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <header>
    <h1>GoojPrt PT-210 Print Server</h1>
    <div class="status">
      <span id="status-pill" class="pill pill-{{ 'ok' if connected else 'bad' }}">
        {{ '● Connected' if connected else '○ Disconnected' }}
      </span>
      <span>Queue: <span id="queue-size">{{ queue_size }}</span>/<span id="queue-max">{{ queue_max }}</span></span>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
