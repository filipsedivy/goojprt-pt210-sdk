[project]
name = "goojprt-pt210-sdk"
dynamic = ["version"]
description = "Unofficial Python SDK for the GOOJPRT PT-210 thermal printer (BLE / SPP)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleak>=0.22",
    "pillow>=10.0",
    "pdf417>=0.8",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "python-multipart>=0.0.9",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
docs = [
    "sphinx>=7.0",
]

[project.scripts]
goojprt = "goojprt.cli:main"
goojprt-server = "goojprt_server.cli:main"

[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goojprt", "goojprt_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.2",
    "hatch-vcs>=0.5.0",
    "numpy>=2.4.4",
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["goojprt", "goojprt_server"]
# Root orchestrators not yet fully refactored — exclude until refactor is complete
ignore = [
    "goojprt/template.py",
    "goojprt/printer.py",
    "goojprt/cli.py",
]
