[project]
name = "goojprt-pt210-sdk"
version = "0.1.0"
description = "Unofficial Python SDK for the GOOJPRT PT-210 thermal printer (BLE / SPP)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleak>=0.22",
    "pillow>=10.0",
    "pdf417>=0.8",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "python-multipart>=0.0.9",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
goojprt = "goojprt.cli:main"
goojprt-server = "goojprt_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goojprt", "goojprt_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.2",
    "numpy>=2.4.4",
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["goojprt", "goojprt_server"]
