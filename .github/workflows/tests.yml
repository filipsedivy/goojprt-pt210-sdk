name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --extra server --extra test

      # The test environment above includes the dev group; this one holds only
      # what `pip install goojprt-pt210-sdk` installs, so an undeclared runtime
      # dependency fails here instead of on a user's machine.
      - name: Smoke test (runtime dependencies only)
        run: uv run --isolated --no-dev --frozen python scripts/smoke_runtime.py

      - name: Run type checks
        run: uv run basedpyright

      - name: Run tests with coverage
        run: uv run pytest --cov=goojprt --cov=goojprt_server --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
