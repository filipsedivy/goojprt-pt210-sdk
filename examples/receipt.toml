# A small receipt built from a logo, bitmap text and a table grid (always
# prints diacritics correctly). logo.png is 640 px wide; `fit = "shrink"` (the
# default) scales it down to the paper instead of cutting it off.
#
#   goojprt <address> --template examples/receipt.toml \
#       --var shop="Corner Shop" --var total="12.50"

[[items]]
type = "image"
path = "logo.png"          # relative to this file
align = "center"

[[items]]
type = "text_image"
text = "{{shop}}"
font_size = 32
align = "center"

[[items]]
type = "text"
text = "{{datetime}}"
align = "center"

[[items]]
type = "line"

[[items]]
type = "grid"
columns = [
  { width = 65, align = "left",  text = "Coffee" },
  { width = 35, align = "right", text = "3.50" },
]

[[items]]
type = "grid"
columns = [
  { width = 65, align = "left",  text = "Croissant" },
  { width = 35, align = "right", text = "2.80" },
]

[[items]]
type = "line"

[[items]]
type = "text_image"
text = "Total  {{total}}"
font_size = 28
align = "right"

[[items]]
type = "feed"
lines = 4
